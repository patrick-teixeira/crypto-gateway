server {
  listen 80;
  listen [::]:80;
  server_name crypto-gateway.169.58.152.4.sslip.io;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name crypto-gateway.169.58.152.4.sslip.io;

  ssl_certificate /etc/letsencrypt/live/crypto-gateway.169.58.152.4.sslip.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/crypto-gateway.169.58.152.4.sslip.io/privkey.pem;

  include /etc/nginx/global_settings;

  location / {
    proxy_pass http://127.0.0.1:3020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
